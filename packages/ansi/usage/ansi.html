<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ansi</title>
  <style>pre { font: normal 16px/1.5 monospace; }</style>
</head>
<body>
  <pre id="output"></pre>
  <script type="module">
    import { icon, html, color } from '../dist/ansi.mjs';

    const output = document.getElementById('output');
  
    output.innerHTML += html(`Color ${color.fgBright.red('red')}`)+'<br>';
    output.innerHTML += html(`And ${color.bg.yellow('Yellow')} background`)+'<br>';
    output.innerHTML += `Icons<br> ${JSON.stringify(icon, 0, 2)}`;
  </script>
</body>
</html>
